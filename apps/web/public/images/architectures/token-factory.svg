</style></defs><g class="t"><text x="90" y="82" class="e">TOKEN FACTORY · POLICY FIRST</text><text x="90" y="132" class="h">One factory. Safer defaults by issuer profile.</text><g class="node-card" transform="translate(110 225)" data-card-x="110" data-card-y="225" data-card-width="330" data-card-height="125"><rect x="0" y="0" width="330" height="125" rx="16" class="surf"/><text x="165.0" y="45" text-anchor="middle" class="n">Project</text><text x="165.0" y="76" text-anchor="middle" class="s"><tspan x="165.0" dy="0">capped mint default</tspan></text></g><g class="node-card" transform="translate(555 225)" data-card-x="555" data-card-y="225" data-card-width="330" data-card-height="125"><rect x="0" y="0" width="330" height="125" rx="16" class="surf"/><text x="165.0" y="45" text-anchor="middle" class="n">Company</text><text x="165.0" y="76" text-anchor="middle" class="s"><tspan x="165.0" dy="0">verified organization + multisig</tspan></text></g><g class="node-card" transform="translate(1000 225)" data-card-x="1000" data-card-y="225" data-card-width="330" data-card-height="125"><rect x="0" y="0" width="330" height="125" rx="16" class="surf"/><text x="165.0" y="45" text-anchor="middle" class="n">Government</text><text x="165.0" y="76" text-anchor="middle" class="s"><tspan x="165.0" dy="0">restricted-transfer review default</tspan></text></g><path d="M275 350V420" class="rail utility"/><path d="M720 350V420" class="rail utility"/><path d="M1165 350V420" class="rail utility"/><path d="M275 420H1165" class="rail utility"/><path d="M720 420V455" class="edge utility"/><g class="edge-label"><rect x="673.3" y="422.5" width="93.4" height="22" rx="9" class="label"/><text x="720" y="437.5" text-anchor="middle" class="m">issuer policy</text></g><g class="node-card" transform="translate(405 455)" data-card-x="405" data-card-y="455" data-card-width="630" data-card-height="120"><rect x="0" y="0" width="630" height="120" rx="16" class="core"/><text x="315.0" y="45" text-anchor="middle" class="n core-title">Token-2022 Factory Policy</text><text x="315.0" y="76" text-anchor="middle" class="s core-sub"><tspan x="315.0" dy="0">metadata · cap · mint authority · transfer controls · reserve policy</tspan></text></g><path d="M720 575V620" class="rail utility"/><path d="M335 620H1105" class="rail utility"/><g class="edge-label"><rect x="673.3" y="582.5" width="93.4" height="22" rx="9" class="label"/><text x="720" y="597.5" text-anchor="middle" class="m">approved mode</text></g><path d="M335 620V650" class="edge trust"/><path d="M720 620V650" class="edge utility"/><path d="M1105 620V650" class="edge warn"/><g class="node-card" transform="translate(170 650)" data-card-x="170" data-card-y="650" data-card-width="330" data-card-height="120"><rect x="0" y="0" width="330" height="120" rx="16" class="box"/><text x="165.0" y="45" text-anchor="middle" class="n">Fixed supply</text><text x="165.0" y="76" text-anchor="middle" class="s"><tspan x="165.0" dy="0">mint authority revoked</tspan></text></g><g class="node-card" transform="translate(555 650)" data-card-x="555" data-card-y="650" data-card-width="330" data-card-height="120"><rect x="0" y="0" width="330" height="120" rx="16" class="box"/><text x="165.0" y="45" text-anchor="middle" class="n">Capped mint</text><text x="165.0" y="76" text-anchor="middle" class="s"><tspan x="165.0" dy="0">policy-controlled issuance</tspan></text></g><g class="node-card" transform="translate(940 650)" data-card-x="940" data-card-y="650" data-card-width="330" data-card-height="120"><rect x="0" y="0" width="330" height="120" rx="16" class="box"/><text x="165.0" y="45" text-anchor="middle" class="n">Reserve backed</text><text x="165.0" y="76" text-anchor="middle" class="s"><tspan x="165.0" dy="0">reserve + redemption policy required</tspan></text></g><text x="90" y="855" class="s">Source: Token Factory Security v1.0.0 · Default planning cap and fee never bypass issuer, signer, reserve or compatibility review.</text></g></svg>