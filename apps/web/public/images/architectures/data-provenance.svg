<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Data provenance and freshness</title><desc id="desc">Operational data is classified by source identity, observation time, freshness, latency and explicit mode.</desc><rect width="1440" height="900" fill="#fff"/><defs>
