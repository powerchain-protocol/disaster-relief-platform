ext><text x="115.0" y="86" text-anchor="middle" class="s"><tspan x="115.0" dy="0">documents · IoT ·</tspan><tspan x="115.0" dy="17">attestations</tspan></text></g><g class="node-card" transform="translate(935 230)" data-card-x="935" data-card-y="230" data-card-width="230" data-card-height="120"><rect x="0" y="0" width="230" height="120" rx="16" class="box"/><g class="node-badge" data-badge="LIVE"><rect x="150.0" y="12" width="66.0" height="24" rx="12" fill="#F1F8F4" stroke="#D6E7DD" class="badge"/><text x="183.0" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#17653F">LIVE</text></g><text x="115.0" y="58" text-anchor="middle" class="n">Application DB</text><text x="115.0" y="86" text-anchor="middle" class="s"><tspan x="115.0" dy="0">workflow + policy records</tspan></text></g><path d="M195 350V415" class="rail trust"/><path d="M480 350V415" class="rail trust"/><path d="M765 350V415" class="rail warn"/><path d="M1050 350V415" class="rail trust"/><path d="M195 415H1050" class="rail trust"/><path d="M720 415V445" class="edge trust"/><g class="edge-label"><rect x="682.0" y="415.0" width="76.0" height="22" rx="9" class="label"/><text x="720" y="430.0" text-anchor="middle" class="m">provenance</text></g><g class="node-card" transform="translate(475 445)" data-card-x="475" data-card-y="445" data-card-width="490" data-card-height="120"><rect x="0" y="0" width="490" height="120" rx="16" class="core"/><text x="245.0" y="45" text-anchor="middle" class="n core-title">Provenance &amp; Freshness Gate</text><text x="245.0" y="76" text-anchor="middle" class="s core-sub"><tspan x="245.0" dy="0">sourceId · observedAt · updatedAt · latency · freshness · stale</tspan></text></g><path d="M720 565V620" class="rail trust"/><path d="M250 620H1195" class="rail trust"/><g class="edge-label"><rect x="686.0" y="577.5" width="68.0" height="22" rx="9" class="label"/><text x="720" y="592.5" text-anchor="middle" class="m">classify</text></g><path d="M250 620V650" class="edge trust"/><path d="M565 620V650" class="edge warn"/><path d="M880 620V650" class="edge"/><path d="M1195 620V650" class="edge warn"/><g class="node-card" transform="translate(160 650)" data-card-x="160" data-card-y="650" data-card-width="180" data-card-height="100"><rect x="0" y="0" width="180" height="100" rx="16" class="surf"/><text x="90.0" y="45" text-anchor="middle" class="n">LIVE</text><text x="90.0" y="76" text-anchor="middle" class="s"><tspan x="90.0" dy="0">authoritative +</tspan><tspan x="90.0" dy="17">fresh</tspan></text></g><g class="node-card" transform="translate(475 650)" data-card-x="475" data-card-y="650" data-card-width="180" data-card-height="100"><rect x="0" y="0" width="180" height="100" rx="16" class="surf"/><text x="90.0" y="45" text-anchor="middle" class="n">DEGRADED</text><text x="90.0" y="76" text-anchor="middle" class="s"><tspan x="90.0" dy="0">stale / partial</tspan><tspan x="90.0" dy="17">provider</tspan></text></g><g class="node-card" transform="translate(790 650)" data-card-x="790" data-card-y="650" data-card-width="180" data-card-height="100"><rect x="0" y="0" width="180" height="100" rx="16" class="surf"/><text x="90.0" y="45" text-anchor="middle" class="n">UNAVAILABLE</text><text x="90.0" y="76" text-anchor="middle" class="s"><tspan x="90.0" dy="0">no acceptable source</tspan></text></g><g class="node-card" transform="translate(1105 650)" data-card-x="1105" data-card-y="650" data-card-width="180" data-card-height="100"><rect x="0" y="0" width="180" height="100" rx="16" class="surf"/><text x="90.0" y="45" text-anchor="middle" class="n">DEMO</text><text x="90.0" y="76" text-anchor="middle" class="s"><tspan x="90.0" dy="0">fixture only</tspan></text></g><text x="90" y="855" class="s">Source: PowerChain data contract v1.0.0 · Mainnet renders authoritative data or explicit DEGRADED / UNAVAILABLE; demo fixtures stay labeled DEMO.</text></g></svg>