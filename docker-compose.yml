services:
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      POWERCHAIN_API_URL: http://api:4000
      POWERCHAIN_INTERNAL_API_TOKEN: ${POWERCHAIN_INTERNAL_API_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
