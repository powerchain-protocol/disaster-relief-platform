hor="middle" class="s"><tspan x="90.0" dy="0">manual settlement</tspan></text></g><path d="M300 315H365" class="edge utility"/><g class="edge-label"><rect x="298.5" y="283" width="68.0" height="22" rx="9" class="label"/><text x="332.5" y="298" text-anchor="middle" class="m">evidence</text></g><path d="M565 315H630" class="edge trust"/><g class="edge-label"><rect x="563.5" y="283" width="68.0" height="22" rx="9" class="label"/><text x="597.5" y="298" text-anchor="middle" class="m">verify</text></g><path d="M830 315H895" class="edge trust"/><g class="edge-label"><rect x="828.5" y="283" width="68.0" height="22" rx="9" class="label"/><text x="862.5" y="298" text-anchor="middle" class="m">review</text></g><path d="M1095 315H1160" class="edge trust"/><g class="edge-label"><rect x="1093.5" y="283" width="68.0" height="22" rx="9" class="label"/><text x="1127.5" y="298" text-anchor="middle" class="m">approve</text></g><path d="M1250 370V455H720V510" class="edge trust"/><g class="edge-label"><rect x="936.2" y="425" width="87.6" height="22" rx="9" class="label"/><text x="980" y="440" text-anchor="middle" class="m">epoch budget</text></g><g class="node-card" transform="translate(260 510)" data-card-x="260" data-card-y="510" data-card-width="920" data-card-height="180"><rect x="0" y="0" width="920" height="180" rx="16" class="surf"/><g class="node-badge" data-badge="NO AUTO MINT"><rect x="811.6" y="12" width="94.4" height="24" rx="12" fill="#FFF9EE" stroke="#E3C889" class="badge"/><text x="858.8" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#8D5E08">NO AUTO MINT</text></g><text x="460.0" y="58" text-anchor="middle" class="n">Epoch Controls</text><text x="460.0" y="86" text-anchor="middle" class="s"><tspan x="460.0" dy="0">bounded budget · subject/org caps · duplicate/replay detection · challenge/reversal</tspan></text></g><text x="90" y="855" class="s">Source: Community Rewards roadmap v1.0.0 · Rewards never grant treasury authority or automatically change 