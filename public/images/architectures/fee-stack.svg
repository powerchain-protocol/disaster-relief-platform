</style></defs><g class="t"><text x="90" y="82" class="e">FEE STACK · SIGNED QUOTE</text><text x="90" y="132" class="h">Every applicable fee is named before authorization.</text><g class="node-card" transform="translate(130 250)" data-card-x="130" data-card-y="250" data-card-width="220" data-card-height="120"><rect x="0" y="0" width="220" height="120" rx="16" class="box"/><text x="110.0" y="45" text-anchor="middle" class="n">Principal</text><text x="110.0" y="76" text-anchor="middle" class="s"><tspan x="110.0" dy="0">crisis capital</tspan></text></g><g class="node-card" transform="translate(375 250)" data-card-x="375" data-card-y="250" data-card-width="220" data-card-height="120"><rect x="0" y="0" width="220" height="120" rx="16" class="box"/><text x="110.0" y="45" text-anchor="middle" class="n">Service fee</text><text x="110.0" y="76" text-anchor="middle" class="s"><tspan x="110.0" dy="0">only if configured</tspan></text></g><g class="node-card" transform="translate(620 250)" data-card-x="620" data-card-y="250" data-card-width="220" data-card-height="120"><rect x="0" y="0" width="220" height="120" rx="16" class="box"/><text x="110.0" y="36" text-anchor="middle" class="n"><tspan x="110.0" dy="0">Token transfer</tspan><tspan x="110.0" dy="22">fee</tspan></text><text x="110.0" y="89" text-anchor="middle" class="s"><tspan x="110.0" dy="0">asset-specific</tspan></text></g><g class="node-card" transform="translate(865 250)" data-card-x="865" data-card-y="250" data-card-width="220" data-card-height="120"><rect x="0" y="0" width="220" height="120" rx="16" class="box"/><text x="110.0" y="45" text-anchor="middle" class="n">Network fee</text><text x="110.0" y="76" text-anchor="middle" class="s"><tspan x="110.0" dy="0">Solana estimate</tspan></text></g><g class="node-card" transform="translate(1110 250)" data-card-x="1110" data-card-y="250" data-card-width="220" data-card-height="120"><rect x="0" y="0" width="220" height="120" rx="16" class="box"/><text x="110.0" y="45" text-anchor="middle" class="n">Provider fee</text><text x="110.0" y="76" text-anchor="middle" class="s"><tspan x="110.0" dy="0">only if rail applies</tspan></text></g><path d="M240 370V420" class="rail capital"/><path d="M485 370V420" class="rail dash"/><path d="M730 370V420" class="rail dash"/><path d="M975 370V420" class="rail warn"/><path d="M1220 370V420" class="rail dash"/><path d="M240 420H1220" class="rail utility"/><path d="M720 420V455" class="edge utility"/><g class="edge-label"><rect x="676.2" y="422.5" width="87.6" height="22" rx="9" class="label"/><text x="720" y="437.5" text-anchor="middle" class="m">quote inputs</text></g><g class="node-card" transform="translate(420 455)" data-card-x="420" data-card-y="455" data-card-width="600" data-card-height="130"><rect x="0" y="0" width="600" height="130" rx="16" class="core"/><text x="300.0" y="45" text-anchor="middle" class="n core-title">Canonical Quote</text><text x="300.0" y="76" text-anchor="middle" class="s core-sub"><tspan x="300.0" dy="0">quoteHash · policyVersion · feeScheduleVersion · expiry</tspan></text></g><path d="M720 585V650" class="edge trust"/><g class="edge-label"><rect x="686.0" y="602.5" width="68.0" height="22" rx="9" class="label"/><text x="720" y="617.5" text-anchor="middle" class="m">sign</text></g><g class="node-card" transform="translate(485 650)" data-card-x="485" data-card-y="650" data-card-width="470" data-card-height="105"><rect x="0" y="0" width="470" height="105" rx="16" class="surf"/><text x="235.0" y="45" text-anchor="middle" class="n">Wallet / Payment Authorization</text><text x="235.0" y="76" text-anchor="middle" class="s"><tspan x="235.0" dy="0">material changes require re-quote + re-simulation</tspan></text></g><text x="90" y="855" class="s">Source: PowerChain fee model v1.0.0 · The 5% success commission is charged from successful pool proceeds, not contributor checkout.</text></g></svg>